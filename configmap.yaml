apiVersion: v1
kind: ConfigMap
metadata:
  name: anythingllm-mcp-config
  namespace: ai-assistant
data:
  anythingllm_mcp_servers.json: |
    {
      "mcpServers": {
        "k8sgpt": {
          "command": "/app/k8sgpt",
          "args": ["serve", "--mcp", "--backend=localai"],
          "env": {
            "XDG_CONFIG_HOME": "/app/server/storage/k8sgpt-config",
            "LOCALAI_BASE_URL": "https://generativelanguage.googleapis.com/v1beta/openai/",
            "LOCALAI_MODEL": "gemini-2.0-flash"
          }
        },
        "prometheus": {
          "command": "uvx",
          "args": ["prometheus-mcp-server"],
          "env": {
            "PROMETHEUS_URL": "http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"
          }
        },
        "grafana": {
          "command": "uvx",
          "args": ["mcp-grafana", "--disable-write"],
          "timeout": 120000,
          "env": {
            "GRAFANA_URL": "http://monitoring-grafana.monitoring.svc.cluster.local:80",
            "GRAFANA_SERVICE_ACCOUNT_TOKEN": "You can enter your token here"
          }
        }
      }
    }
  k8sgpt.yaml: |
    ai:
      providers:
        - name: localai
          model: gemini-2.0-flash
          baseurl: https://generativelanguage.googleapis.com/v1beta/openai/
      defaultprovider: localai
    kubeconfig: ""
    kubecontext: ""
