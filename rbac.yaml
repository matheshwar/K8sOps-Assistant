apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: anythingllm-admin
rules:
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["*"]
- nonResourceURLs: ["*"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: anythingllm-admin
subjects:
- kind: ServiceAccount
  name: anythingllm-sa
  namespace: ai-assistant
roleRef:
  kind: ClusterRole
  name: anythingllm-admin
  apiGroup: rbac.authorization.k8s.io
