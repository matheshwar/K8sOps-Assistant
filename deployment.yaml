apiVersion: apps/v1
kind: Deployment
metadata:
  name: anythingllm
  namespace: ai-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: anythingllm
  template:
    metadata:
      labels:
        app: anythingllm
    spec:
      serviceAccountName: anythingllm-sa
      securityContext:
        runAsUser: 0
        fsGroup: 0
      containers:
      - name: anythingllm
        image: anythingllm-custom:2.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3001
        env:
        - name: STORAGE_DIR
          value: "/app/server/storage"
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1"
            memory: "2Gi"
        volumeMounts:
        - name: storage
          mountPath: /app/server/storage
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: anythingllm-storage
      - name: mcp-config
        configMap:
          name: anythingllm-mcp-config-v2
